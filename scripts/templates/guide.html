<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            color: #f8fafc;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }
        .card h2 {
            color: #38bdf8;
            font-size: 1.2rem;
            margin-bottom: 0.75rem;
        }
        .card p {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 1rem;
        }
        .options { display: flex; flex-direction: column; gap: 0.75rem; }
        .option-btn {
            background: #334155;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            color: #e2e8f0;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        .option-btn .option-desc {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }
        .option-btn:hover .option-desc { color: #dbeafe; }
        .result {
            background: #064e3b;
            border: 1px solid #059669;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .result h2 { color: #34d399; }
        .result .guidance {
            background: #022c22;
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
            line-height: 1.7;
            white-space: pre-wrap;
        }
        .warning {
            background: #451a03;
            border: 1px solid #d97706;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-top: 0.75rem;
            font-size: 0.9rem;
            color: #fbbf24;
        }
        .warning::before { content: "⚠ "; }
        .references {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #64748b;
        }
        .back-btn {
            background: none;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        .back-btn:hover { border-color: #94a3b8; color: #e2e8f0; }
        .progress {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .progress-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #334155;
        }
        .progress-dot.active { background: #3b82f6; }
        .progress-dot.completed { background: #059669; }
        .hidden { display: none; }
        .terms-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #334155;
        }
        .term-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .term-card {
            background: #1e293b;
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid #334155;
        }
        .term-card strong { color: #38bdf8; }
        .term-card p { color: #94a3b8; font-size: 0.9rem; margin-top: 0.25rem; }
        .quick-ref {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #334155;
        }
        .ref-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid #1e293b;
        }
        .ref-item strong { color: #f8fafc; }
        .ref-item p { color: #94a3b8; font-size: 0.9rem; }
        .restart-btn {
            display: inline-block;
            margin-top: 1.5rem;
            background: #1e40af;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            color: white;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .restart-btn:hover { background: #2563eb; }
        .nav-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
        }
        .nav-tab {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            background: none;
            border: 1px solid #334155;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .nav-tab.active { background: #334155; color: #f8fafc; border-color: #3b82f6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ title }}</h1>
        <p class="subtitle">{{ purpose }}</p>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showSection('guide')">Guide</button>
            <button class="nav-tab" onclick="showSection('terms')">Terminology</button>
            <button class="nav-tab" onclick="showSection('reference')">Quick Reference</button>
        </div>

        <!-- Guide Section -->
        <div id="section-guide">
            <div class="progress" id="progress"></div>
            <div id="content"></div>
        </div>

        <!-- Terminology Section -->
        <div id="section-terms" class="hidden terms-section">
            <h2 style="color: #38bdf8; margin-bottom: 1rem;">Terminology</h2>
            <div class="term-grid">
                {% for term in terminology %}
                <div class="term-card">
                    <strong>{{ term.term }}</strong>
                    <p>{{ term.definition }}</p>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- Quick Reference Section -->
        <div id="section-reference" class="hidden quick-ref">
            <h2 style="color: #38bdf8; margin-bottom: 1rem;">Quick Reference</h2>
            {% for ref in quick_reference %}
            <div class="ref-item">
                <strong>{{ ref.topic }}</strong>
                <p>{{ ref.key_point }}</p>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
    const data = {{ data_json }};

    let history = [];
    let currentId = data.decision_points[0]?.id || null;

    function render() {
        const content = document.getElementById('content');
        const progress = document.getElementById('progress');

        // Update progress dots
        const totalSteps = data.decision_points.length;
        progress.innerHTML = Array.from({length: totalSteps}, (_, i) => {
            const cls = i < history.length ? 'completed' : i === history.length ? 'active' : '';
            return `<div class="progress-dot ${cls}"></div>`;
        }).join('');

        // Find current item
        const dp = data.decision_points.find(d => d.id === currentId);
        if (dp) {
            content.innerHTML = `
                <div class="card">
                    <h2>${dp.question}</h2>
                    <p>${dp.context || ''}</p>
                    <div class="options">
                        ${dp.options.map(opt => `
                            <button class="option-btn" onclick="choose('${opt.leads_to}', '${dp.id}')">
                                ${opt.label}
                                ${opt.description ? `<span class="option-desc">${opt.description}</span>` : ''}
                            </button>
                        `).join('')}
                    </div>
                </div>
                ${history.length > 0 ? `<button class="back-btn" onclick="goBack()">← Go back</button>` : ''}
            `;
            return;
        }

        // Check if it's a result
        const result = data.results.find(r => r.id === currentId);
        if (result) {
            content.innerHTML = `
                <div class="result">
                    <h2>${result.title}</h2>
                    <div class="guidance">${result.guidance}</div>
                    ${(result.warnings || []).map(w => `<div class="warning">${w}</div>`).join('')}
                    ${result.references && result.references.length ? `
                        <div class="references">References: ${result.references.join(', ')}</div>
                    ` : ''}
                </div>
                <button class="back-btn" onclick="goBack()">← Go back</button>
                <button class="restart-btn" onclick="restart()">Start Over</button>
            `;
            return;
        }

        content.innerHTML = '<div class="card"><p>End of guide. Click restart to begin again.</p></div><button class="restart-btn" onclick="restart()">Start Over</button>';
    }

    function choose(nextId, fromId) {
        history.push(currentId);
        currentId = nextId;
        render();
    }

    function goBack() {
        if (history.length > 0) {
            currentId = history.pop();
            render();
        }
    }

    function restart() {
        history = [];
        currentId = data.decision_points[0]?.id || null;
        render();
    }

    function showSection(name) {
        document.querySelectorAll('[id^="section-"]').forEach(el => el.classList.add('hidden'));
        document.getElementById(`section-${name}`).classList.remove('hidden');
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
    }

    render();
    </script>
</body>
</html>
