[project]
name = "naf-ai-workshop"
version = "2.0.0"
description = "AI Workshop - Transform unstructured content into interactive deliverables using AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # AI / LLM
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    # Document processing
    "pymupdf>=1.25.0",
    "youtube-transcript-api>=1.0.0",
    # Data sources
    "feedparser>=6.0.0",
    "requests>=2.31.0",
    # Output generation
    "jinja2>=3.1.0",
    # Utilities
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
